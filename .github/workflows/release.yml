name: Release

# Cut a release by pushing a version tag that matches YWRVersion.current:
#   git tag v0.1.0 && git push origin v0.1.0
# This builds, Developer ID-signs, notarizes, staples, and publishes the app to
# a GitHub Release. Requires the repository secrets documented in RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    name: Build, notarize & publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches YWRVersion.current
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          SRC="$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' Sources/YWRCore/Version.swift | tr -d '"' | head -1)"
          echo "tag=$TAG  YWRVersion.current=$SRC"
          if [ "$TAG" != "$SRC" ]; then
            echo "::error::tag v$TAG does not match YWRVersion.current $SRC — bump Sources/YWRCore/Version.swift"
            exit 1
          fi

      - name: Import Developer ID certificate into a temporary keychain
        env:
          CERT_P12_BASE64: ${{ secrets.SIGNING_CERTIFICATE_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/ywr-signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          # Put our keychain first in the search list so codesign finds the identity.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build, sign & notarize
        env:
          YWR_DEVELOPER_ID: ${{ secrets.SIGNING_IDENTITY }}
          YWR_NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          YWR_NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          YWR_NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: bash scripts/release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/YabaiWorkspaces.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)." \
            --verify-tag
